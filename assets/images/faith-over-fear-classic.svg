<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .faith-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        fill: #0a0a0a;
        text-anchor: middle;
      }
      .faith-watermark {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        fill: #0a0a0a;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Crisp White Matte Background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Minimalist Corner Registration / Crop Marks -->
  <g stroke="#0a0a0a" stroke-width="2" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 40 64 L 40 40 L 64 40" />
    <!-- Top-Right -->
    <path d="M 1216 40 L 1240 40 L 1240 64" />
    <!-- Bottom-Left -->
    <path d="M 40 656 L 40 680 L 64 680" />
    <!-- Bottom-Right -->
    <path d="M 1216 680 L 1240 680 L 1240 656" />
  </g>

  <!-- Subtle Inset Hairline Frame -->
  <rect x="52" y="52" width="1176" height="616" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>

  <!-- Minimalist Geometric Apex Motif (Illumination / Hope) -->
  <g transform="translate(640, 136)">
    <!-- 8-point geometric compass star -->
    <polygon points="0,-26 5,-6 26,0 5,6 0,26 -5,6 -26,0 -5,-6" fill="#0a0a0a"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- FAITH (On Top) -->
  <text x="640" y="314" class="faith-title" font-size="124" letter-spacing="18">FAITH</text>

  <!-- The Line (Replacing 'OVER') -->
  <g id="divider-rule">
    <!-- Solid, Confident Horizontal Bar -->
    <line x1="280" y1="360" x2="1000" y2="360" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- FEAR (Below the line) -->
  <text x="640" y="496" class="faith-title" font-size="124" letter-spacing="30">FEAR</text>

  <!-- Watermark: rdjarbeng.com (Subtle & Visible per guidelines) -->
  <g transform="translate(640, 650)">
    <line x1="-240" y1="-6" x2="-120" y2="-6" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" class="faith-watermark" font-size="18" letter-spacing="6" opacity="0.6">rdjarbeng.com</text>
    <line x1="120" y1="-6" x2="240" y2="-6" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
  </g>
</svg>