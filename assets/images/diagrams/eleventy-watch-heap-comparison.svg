<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320" role="img" aria-labelledby="heap-title heap-desc">
  <title id="heap-title">Node.js Heap Memory in Eleventy Watch Mode: Default vs Forced GC</title>
  <desc id="heap-desc">Comparison chart showing uncollected heap memory steadily rising to 4GB crash versus forced garbage collection resetting memory back to 430MB after each rebuild.</desc>

  <rect width="800" height="320" fill="#f4f1e6"/>

  <g transform="translate(40, 24)">
    <text x="0" y="24" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#141414">NODE.JS HEAP BEHAVIOR IN ELEVENTY WATCH MODE</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="18" fill="#57514a">Comparing uncollected heap accumulation versus post-build forced GC</text>

    <!-- Chart Grid -->
    <g transform="translate(0, 65)">
      <!-- 4GB OOM Threshold Line -->
      <line x1="75" y1="20" x2="560" y2="20" stroke="#d7263d" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="65" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d7263d" text-anchor="end">4 GB</text>
      <text x="575" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d7263d">Fatal OOM (134)</text>

      <!-- 2GB Baseline Line -->
      <line x1="75" y1="90" x2="560" y2="90" stroke="#cfc6b6" stroke-width="1"/>
      <text x="65" y="95" font-family="Arial, sans-serif" font-size="18" fill="#7d756d" text-anchor="end">2 GB</text>

      <!-- Baseline 500MB Line -->
      <line x1="75" y1="160" x2="560" y2="160" stroke="#cfc6b6" stroke-width="1.5"/>
      <text x="65" y="165" font-family="Arial, sans-serif" font-size="18" fill="#7d756d" text-anchor="end">500 MB</text>
      <text x="575" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b998b">~430 MB Stable</text>

      <!-- Bottom Axis -->
      <line x1="75" y1="180" x2="560" y2="180" stroke="#141414" stroke-width="2"/>
      <text x="110" y="202" font-family="Arial, sans-serif" font-size="18" fill="#57514a" text-anchor="middle">Cold Build</text>
      <text x="240" y="202" font-family="Arial, sans-serif" font-size="18" fill="#57514a" text-anchor="middle">Edit 1</text>
      <text x="370" y="202" font-family="Arial, sans-serif" font-size="18" fill="#57514a" text-anchor="middle">Edit 2</text>
      <text x="500" y="202" font-family="Arial, sans-serif" font-size="18" fill="#57514a" text-anchor="middle">Global Edit (2h)</text>

      <!-- Trace 1: Default Behavior (Red path rising to OOM) -->
      <path d="M 110 160 L 240 125 L 370 85 L 500 20" fill="none" stroke="#d7263d" stroke-width="4"/>
      <circle cx="110" cy="160" r="5" fill="#d7263d"/>
      <circle cx="240" cy="125" r="5" fill="#d7263d"/>
      <circle cx="370" cy="85" r="5" fill="#d7263d"/>
      <circle cx="500" cy="20" r="7" fill="#d7263d" stroke="#ffffff" stroke-width="2"/>

      <!-- Trace 2: With Exposed GC (Green path resetting every time) -->
      <path d="M 110 160 L 225 140 L 240 165 L 355 135 L 370 165 L 485 130 L 500 165" fill="none" stroke="#1b998b" stroke-width="4"/>
      <circle cx="240" cy="165" r="5" fill="#1b998b"/>
      <circle cx="370" cy="165" r="5" fill="#1b998b"/>
      <circle cx="500" cy="165" r="6" fill="#1b998b" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
</svg>