<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" role="img" aria-labelledby="heap-title heap-desc">
  <title id="heap-title">Heap still in use after forced garbage collection, over 12 Eleventy builds</title>
  <desc id="heap-desc">Line chart of 12 builds in the same dev server session. With the leak, heap after garbage collection climbs from 565 MB to 2,138 MB, about 150 MB per rebuild. With the fix it stays between 536 and 587 MB and ends at 580 MB.</desc>

  <rect width="800" height="420" fill="#f4f1e6"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#141414">Forced GC ran after every build. The leak still grew.</text>
  <text x="32" y="68" font-family="Arial, sans-serif" font-size="18" fill="#57514a">Heap still in use after garbage collection, same 12 builds</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#3a352f">
    <line x1="32" y1="94" x2="58" y2="94" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="100">Before the fix</text>
    <line x1="206" y1="94" x2="232" y2="94" stroke="#2563c9" stroke-width="3" stroke-linecap="round"/>
    <text x="240" y="100">After the fix</text>
  </g>

  <!-- Grid: y = 360 - mb * 0.11 -->
  <g stroke="#ddd5c6" stroke-width="1">
    <line x1="88" y1="305" x2="660" y2="305"/>
    <line x1="88" y1="250" x2="660" y2="250"/>
    <line x1="88" y1="195" x2="660" y2="195"/>
    <line x1="88" y1="140" x2="660" y2="140"/>
  </g>
  <line x1="88" y1="360" x2="660" y2="360" stroke="#6d665d" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="18" fill="#6d665d" text-anchor="end">
    <text x="78" y="365">0</text>
    <text x="78" y="310">500 MB</text>
    <text x="78" y="255">1,000</text>
    <text x="78" y="200">1,500</text>
    <text x="78" y="145">2,000</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#6d665d" text-anchor="middle">
    <text x="100" y="388">Build 1</text>
    <text x="345.5" y="388">Build 6</text>
    <text x="640" y="388">Build 12</text>
  </g>

  <!-- x = 100 + (build - 1) * 49.09; values are the measured post-GC heap for builds 1 to 12 -->
  <polyline fill="none" stroke="#d7263d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="100,297.9 149.1,295 198.2,279.8 247.3,264.5 296.4,249.2 345.5,233.7 394.5,211.5 443.6,194.1 492.7,176.9 541.8,159.5 590.9,142.2 640,124.8"/>
  <polyline fill="none" stroke="#2563c9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="100,297.9 149.1,295.4 198.2,301 247.3,301 296.4,301 345.5,301 394.5,296.2 443.6,296.2 492.7,296.2 541.8,296.2 590.9,296.2 640,296.2"/>

  <circle cx="640" cy="124.8" r="5" fill="#d7263d" stroke="#f4f1e6" stroke-width="2"/>
  <circle cx="640" cy="296.2" r="5" fill="#2563c9" stroke="#f4f1e6" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="20" fill="#141414">
    <text x="652" y="120" font-weight="700">2,138 MB</text>
    <text x="652" y="144" font-size="16" fill="#57514a">about +150 per</text>
    <text x="652" y="164" font-size="16" fill="#57514a">rebuild</text>
    <text x="652" y="292" font-weight="700">580 MB</text>
    <text x="652" y="316" font-size="16" fill="#57514a">flat after settling</text>
  </g>
</svg>
