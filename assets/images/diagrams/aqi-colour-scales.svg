<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 497" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">The same air, different colour scales</title>
<desc id="d">Two air quality colour scales as strips. The US AQI has six bands: Good, 0 to 50, green; Moderate, 51 to 100, yellow; Unhealthy for Sensitive Groups, 101 to 150, orange; Unhealthy, 151 to 200, red; Very Unhealthy, 201 to 300, purple; Hazardous, 301 and above, maroon. China's AQI also has six bands: Excellent, 0 to 50, green; Good, 51 to 100, yellow; Lightly polluted, 101 to 150, orange; Moderately polluted, 151 to 200, red; Heavily polluted, 201 to 300, a darker purple than the US one; Severely polluted, above 300, maroon.</desc>
