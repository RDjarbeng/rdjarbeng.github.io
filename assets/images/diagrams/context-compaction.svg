<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 726" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">How compaction squeezes a full context window</title>
<desc id="d">A tall container stands for the context window. Three blocks load first at the bottom: the system prompt, CLAUDE.md and memory. Blocks of messages and tool output stack on top, including one message with an instruction from an hour ago, until they reach a dashed line marked compaction point. The messages and tool output are then squeezed into one small block labelled summary, and fragments of text spill out of the window. The instruction from an hour ago does not make it into the summary and is left as a dashed outline. The system prompt, CLAUDE.md and memory stay at full size, re-read from disk.</desc>
