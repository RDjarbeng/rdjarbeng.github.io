<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 838" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">From a straight line to a loop</title>
<desc id="d">Two ways to build an app, side by side. The initial plan is a straight line: idea, prototype, final application. The refined process has seven steps: develop the initial idea, test a prototype, discuss and review feedback, run a second test as a beta, a second discussion and review, a final test for errors, and deploy the final application. Each review loops back to the step before it, so feedback leads to another round of changes before moving on.</desc>
