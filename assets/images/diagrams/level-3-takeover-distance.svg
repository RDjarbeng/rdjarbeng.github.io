<text x="121.5" y="230" fill="#57514a" font-size="18" text-anchor="start">fastest, 53 m</text>
<line x1="201.9" y1="288" x2="201.9" y2="464" stroke="#b87a12" stroke-width="2"/>
<text x="211.9" y="274" fill="#b87a12" font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="start">4.5 to 6 s</text>
<text x="211.9" y="300" fill="#57514a" font-size="18" text-anchor="start">typical, 125 to 167 m</text>
<line x1="330.3" y1="358" x2="330.3" y2="464" stroke="#1f1d1a" stroke-width="2"/>
<text x="340.3" y="344" fill="#1f1d1a" font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="start">about 10 s</text>
<text x="340.3" y="370" fill="#57514a" font-size="18" text-anchor="start">car starts to stop itself, 278 m</text>
<line x1="754.2" y1="288" x2="754.2" y2="464" stroke="#b2477b" stroke-width="2"/>
<text x="744.2" y="274" fill="#b2477b" font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="end">25.7 s</text>
<text x="744.2" y="300" fill="#57514a" font-size="18" text-anchor="end">slowest, 714 m</text>
