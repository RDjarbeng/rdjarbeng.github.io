<text x="643.3" y="496" fill="#57514a" font-size="18" text-anchor="middle">600 m</text>
<line x1="740.6" y1="470" x2="740.6" y2="476" stroke="#1f1d1a"/>
<rect x="60" y="522" width="102.1" height="34" fill="none" stroke="#1f1d1a" stroke-width="1.5"/>
<line x1="111.0" y1="522" x2="111.0" y2="556" stroke="#1f1d1a" stroke-width="1.5"/>
