<text x="178.1" y="546" fill="#1f1d1a" font-size="18">One football pitch (105 m) at the same scale</text>
<line x1="32" y1="612" x2="768" y2="612" stroke="#cfc6b6"/>
<text x="32" y="642" fill="#57514a" font-size="18">After grabbing the wheel, drivers needed another 8 to 10 s</text>
<text x="32" y="668" fill="#57514a" font-size="18">to steady the car (Gold et al. 2013; Merat et al. 2014).</text>
</svg>
