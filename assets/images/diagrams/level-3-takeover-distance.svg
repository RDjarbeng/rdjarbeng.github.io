<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">How far a car travels while a driver takes back control</title>
<desc id="d">At 100 km/h a car covers 27.8 metres per second. The fastest takeover, 1.9 seconds, takes 53 metres. Typical takeovers of 4.5 to 6 seconds take 125 to 167 metres. After about 10 seconds, 278 metres, a Level 3 car starts stopping itself. The slowest takeover, 25.7 seconds, takes 714 metres.</desc>
<defs><pattern id="hatchH" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3efe6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b2477b" stroke-width="2.6"/></pattern><pattern id="hatchM" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2f3d66" stroke-width="1.6"/></pattern><pattern id="hatchO" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#b87a12" stroke-width="2"/></pattern></defs>
<rect width="800" height="690" fill="#f3efe6"/>
<text x="32" y="40" fill="#57514a" font-size="18" letter-spacing="2">FIG. 4</text>
<text x="32" y="80" fill="#1f1d1a" font-family="Georgia, 'Times New Roman', serif" font-size="30">The handover gap at 100 km/h</text>
<text x="32" y="112" fill="#57514a" font-size="18">The car moves 27.8 m every second while the driver</text>
<text x="32" y="138" fill="#57514a" font-size="18">looks up. Takeover times: Eriksson and Stanton (2017).</text>
<line x1="32" y1="156" x2="768" y2="156" stroke="#1f1d1a" stroke-width="1.5"/>
<rect x="60" y="410" width="700" height="54" fill="#e4ddd0"/>
<line x1="60" y1="410" x2="760" y2="410" stroke="#1f1d1a" stroke-width="2"/>
<line x1="60" y1="464" x2="760" y2="464" stroke="#1f1d1a" stroke-width="2"/>
<line x1="60" y1="437.0" x2="760" y2="437.0" stroke="#f3efe6" stroke-width="3" stroke-dasharray="16 12"/>
<rect x="181.5" y="410" width="40.8" height="54" fill="url(#hatchO)"/>
<g transform="translate(12 425)"><rect width="44" height="24" fill="#1f1d1a"/><rect x="26" y="4" width="10" height="16" fill="#e4ddd0"/></g>
<line x1="111.5" y1="218" x2="111.5" y2="464" stroke="#2f3d66" stroke-width="2"/>
