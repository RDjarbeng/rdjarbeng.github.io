<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowL4" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="30" y="36" fill="#f8fafc" font-size="19" font-weight="700">SAE Level 4 High Automation: Two Divergent Deployment Paths</text>
  <text x="30" y="58" fill="#94a3b8" font-size="13">Direct comparison across identical operational dimensions with zero in-cabin driver fallback</text>

  <!-- Column 1: Urban Robotaxis -->
  <g transform="translate(30, 80)">
    <rect width="415" height="330" rx="10" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="2" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="415" height="42" rx="10" fill="url(#blueHeader)"/>
    <text x="20" y="27" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">URBAN ROBOTAXIS (PASSENGER RIDE-HAILING)</text>

    <!-- Row 1: Operating Domain -->
    <g transform="translate(20, 58)">
      <circle cx="8" cy="10" r="4" fill="#60a5fa"/>
      <text x="24" y="14" fill="#38bdf8" font-size="12" font-weight="700">OPERATING DOMAIN:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Geofenced metro footprints (SF, Phoenix, Wuhan)</text>
    </g>

    <!-- Row 2: Vehicle Platform -->
    <g transform="translate(20, 104)">
      <circle cx="8" cy="10" r="4" fill="#60a5fa"/>
      <text x="24" y="14" fill="#38bdf8" font-size="12" font-weight="700">VEHICLE PLATFORM:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Light passenger electric vehicles (SUVs &amp; sedans)</text>
    </g>

    <!-- Row 3: Perception Stack -->
    <g transform="translate(20, 150)">
      <circle cx="8" cy="10" r="4" fill="#60a5fa"/>
      <text x="24" y="14" fill="#38bdf8" font-size="12" font-weight="700">PERCEPTION STACK:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">360° roof LiDARs, imaging radar, surround cameras</text>
    </g>

    <!-- Row 4: Commercial Model -->
    <g transform="translate(20, 196)">
      <circle cx="8" cy="10" r="4" fill="#60a5fa"/>
      <text x="24" y="14" fill="#38bdf8" font-size="12" font-weight="700">SERVICE MODEL:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">On-demand consumer ride-hailing apps</text>
    </g>

    <!-- Benchmark Fleets Box -->
    <g transform="translate(20, 245)">
      <rect width="375" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="700">BENCHMARK FLEETS:</text>
      <text x="15" y="44" fill="#f8fafc" font-size="13">Waymo One (Jaguar I-PACE) · Baidu Apollo RT6</text>
    </g>
  </g>

  <!-- Column 2: Municipal Mass Transit -->
  <g transform="translate(475, 80)">
    <rect width="415" height="330" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="415" height="42" rx="10" fill="url(#greenHeader)"/>
    <text x="20" y="27" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">MUNICIPAL MASS TRANSIT (CIVIC MOBILITY)</text>

    <!-- Row 1: Operating Domain -->
    <g transform="translate(20, 58)">
      <circle cx="8" cy="10" r="4" fill="#34d399"/>
      <text x="24" y="14" fill="#34d399" font-size="12" font-weight="700">OPERATING DOMAIN:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Fixed municipal routes, BRT lanes, campus loops</text>
    </g>

    <!-- Row 2: Vehicle Platform -->
    <g transform="translate(20, 104)">
      <circle cx="8" cy="10" r="4" fill="#34d399"/>
      <text x="24" y="14" fill="#34d399" font-size="12" font-weight="700">VEHICLE PLATFORM:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Heavy commercial electric transit (8–12m buses)</text>
    </g>

    <!-- Row 3: Perception Stack -->
    <g transform="translate(20, 150)">
      <circle cx="8" cy="10" r="4" fill="#34d399"/>
      <text x="24" y="14" fill="#34d399" font-size="12" font-weight="700">PERCEPTION STACK:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Transit-grade multi-LiDAR, radar, priority V2X</text>
    </g>

    <!-- Row 4: Commercial Model -->
    <g transform="translate(20, 196)">
      <circle cx="8" cy="10" r="4" fill="#34d399"/>
      <text x="24" y="14" fill="#34d399" font-size="12" font-weight="700">SERVICE MODEL:</text>
      <text x="160" y="14" fill="#e2e8f0" font-size="12">Scheduled civic timetables &amp; feeder transit</text>
    </g>

    <!-- Benchmark Fleets Box -->
    <g transform="translate(20, 245)">
      <rect width="375" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#34d399" font-size="11" font-weight="700">BENCHMARK FLEETS:</text>
      <text x="15" y="44" fill="#f8fafc" font-size="13">ADASTEC flowride.ai on Karsan Autonomous e-ATAK</text>
    </g>
  </g>
</svg>
