<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">From satellite image to a decision</title>
<desc id="d">Five steps from top to bottom: a raw satellite image; analysis-ready data, corrected for haze, sensor angle and cloud, such as Digital Earth Africa publishes; analysis, for example in Google Earth Engine; a map or alert; and a person who acts on it, such as a ministry or a farmer. Three barriers sit along the way: sharp images cost money, at the raw image; raw data needs processing, between the raw image and analysis-ready data; and maps must reach the people who decide, between the map and the person.</desc>
