<text x="32" y="40" fill="#141414" font-size="24" font-weight="bold">Legal particle limits as a multiple of the WHO 2021 guideline</text>
<text x="32" y="72" fill="#57514a" font-size="18">Longer line = looser limit. 1x (gold line) = the WHO guideline for the same period.</text>
