<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">Legal particle limits as a multiple of the WHO 2021 guideline</title><desc id="d">Dot chart of national PM2.5 and PM10 limits in Côte d'Ivoire, Ghana, Nigeria, Senegal and Benin, shown as times the WHO 2021 guideline, with a reference line at 1 times. PM2.5 annual: Côte d'Ivoire 5, Senegal 5, Nigeria and Benin no limit. PM2.5 24 hours: Ghana 2.3, Senegal 5, Côte d'Ivoire, Nigeria and Benin no limit. PM10 annual: Côte d'Ivoire 2.7, Senegal 2.7, Benin 3.3, Nigeria 4. PM10 24 hours: Côte d'Ivoire 1.1, Nigeria 3.3, Senegal 3.3, Benin 5.1.</desc>
