<title id="t">Same place, again and again</title>
<desc id="d">A satellite photographs the same patch of ground on pass after pass, building a series of images; free Sentinel images arrive every few days. Software compares an earlier image showing forest with a later one showing cleared ground and flags the place where trees have disappeared, which becomes a forest loss alert.</desc>
