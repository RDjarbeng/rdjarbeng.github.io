<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 634" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">The chip war feedback loop</title>
<desc id="d">A loop. US sanctions on AI chips restrict H100s, which opens an innovation gap in China. That gap forces innovation at DeepSeek and Huawei: mixture-of-experts architectures lead to DeepSeek-R1, and domestic chip making leads to the Ascend 910C. Matching performance causes alarm in the US, lost revenue drives US chipmakers to lobby, the policy shifts, sanctions are loosened, and exports are authorised again, which brings the loop back to US sanctions.</desc>
