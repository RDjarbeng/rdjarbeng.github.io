<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 585" width="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title id="t">Who gets the money from a plane ticket</title>
<desc id="d">A tree that splits the total ticket price into the base fare, which goes to the airline, and taxes, surcharges and fees. Those split four ways: surcharges, which go to the airline; passenger service and terminal charges, which go to airport operators; safety and security charges, which go to regulators and security agencies; and departure taxes, tourism levies and VAT, which go to national governments.</desc>
