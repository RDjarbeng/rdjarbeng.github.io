<g transform="translate(48,28)"><rect x="9.88" y="0" width="6.24" height="26" rx="2.08" fill="#d97757"/><rect x="0" y="9.88" width="26" height="6.24" rx="2.08" fill="#d97757"/><rect x="9.88" y="0" width="6.24" height="26" rx="2.08" fill="#d97757" transform="rotate(45 13.0 13.0)"/><rect x="9.88" y="0" width="6.24" height="26" rx="2.08" fill="#d97757" transform="rotate(-45 13.0 13.0)"/></g>
<text x="84" y="44" class="card-title">Claude Sonnet 5.5</text>
<text x="84" y="66" class="card-sub">Anthropic (Web platform)</text>
<rect x="556" y="26" width="200" height="34" fill="#d97757"/>
<text x="656" y="49" class="badge-text">Docs &amp; Hosted Apps</text>
<line x1="48" y1="76" x2="756" y2="76" stroke="#cfc6b6" stroke-width="1"/>
<rect x="48" y="86" width="224" height="106" fill="#f3efe6" stroke="#cfc6b6" stroke-width="1"/>
<text x="60" y="108" class="col-hdr">INPUTS ACCEPTED</text>
<text x="60" y="132" class="col-item">* PDFs &amp; office docs</text>
<text x="60" y="156" class="col-item">* Code repositories</text>
<text x="60" y="180" class="col-item">* CSV &amp; data tables</text>
<rect x="284" y="86" width="224" height="106" fill="#f3efe6" stroke="#cfc6b6" stroke-width="1"/>
<text x="296" y="108" class="col-hdr">ENGINE &amp; TOOLS</text>
<text x="296" y="132" class="col-item">* Live search index fetch</text>
<text x="296" y="156" class="col-item">* Curated sandbox network</text>
<text x="296" y="180" class="col-item">* Multi-file synthesis</text>
<rect x="520" y="86" width="236" height="106" fill="#f3efe6" stroke="#cfc6b6" stroke-width="1"/>
<text x="532" y="108" class="col-hdr">DELIVERABLE FORMAT</text>
<text x="532" y="132" class="col-item">* Downloadable Word (.docx)</text>
<text x="532" y="156" class="col-item">* Formula Excel (.xlsx)</text>
<text x="532" y="180" class="col-item">* Instant hosted web app URL</text>
<line x1="48" y1="202" x2="756" y2="202" stroke="#cfc6b6" stroke-width="1"/>
<text x="48" y="226" class="boundary-label">Hard boundary:</text>
<text x="190" y="226" class="boundary-val">Rejects audio/video uploads; no generative art.</text>
<text x="756" y="252" fill="#57514a" font-size="18" font-weight="700" letter-spacing="1" text-anchor="end">rdjarbeng.com</text>
