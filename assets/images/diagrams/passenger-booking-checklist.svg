<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="100%" height="385" role="img" aria-labelledby="checklist-title checklist-desc">
  <title id="checklist-title">Passenger booking decision checklist</title>
  <desc id="checklist-desc">Six practical steps for travelers booking intra-African flights to avoid hidden costs, missed connections, and visa issues.</desc>

  <rect width="800" height="385" fill="#f4f1e6"/>

  <text x="400" y="38" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#141414" text-anchor="middle">SIX RULES FOR BOOKING INTRA-AFRICAN FLIGHTS</text>

  <!-- Left Column -->
  <g transform="translate(40, 60)">
    <!-- 1. Total Cost -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#1d4f9c"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">1</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Total Cost of Trip</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Include food, hotel, and lost time</text>
    </g>

    <!-- 2. Border Airports -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#2d6a4f"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">2</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Check Neighboring Airports</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Compare border departure taxes</text>
    </g>

    <!-- 3. Surcharges -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#d7263d"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">3</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Inspect YQ / YR Surcharges</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Check cash fees on award miles</text>
    </g>
  </g>

  <!-- Right Column -->
  <g transform="translate(415, 60)">
    <!-- 4. Transit Visas -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#f2c12e"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#141414" text-anchor="middle">4</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Verify Transit Visas</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Check hub immigration rules early</text>
    </g>

    <!-- 5. Fixed Dates -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#1d4f9c"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">5</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Lock In Fixed Dates Early</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Cheaper fare buckets sell first</text>
    </g>

    <!-- 6. Buffer Margins -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="345" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="36" height="92" rx="6" fill="#2d6a4f"/>
      <text x="18" y="52" font-family="'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">6</text>
      <text x="50" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Buffer Connection Times</text>
      <text x="50" y="62" font-family="Arial, sans-serif" font-size="18" fill="#555555">Protect against delay on first leg</text>
    </g>
  </g>
</svg>

