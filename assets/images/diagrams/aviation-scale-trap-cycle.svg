<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="290" role="img" aria-labelledby="trap-title trap-desc">
  <title id="trap-title">The airport scale trap feedback loop</title>
  <desc id="trap-desc">Cycle diagram showing how low traffic forces higher per-passenger fees, which inflates ticket prices and further suppresses passenger demand.</desc>

  <rect width="800" height="290" fill="#f4f1e6"/>

  <g transform="translate(40, 20)">
    <text x="360" y="24" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#141414" text-anchor="middle">THE AIRPORT SCALE TRAP</text>

    <!-- Step 1: Low Traffic -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="160" height="130" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="36" rx="6" fill="#1d4f9c"/>
      <text x="80" y="24" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">1. Low Traffic</text>
      <text x="80" y="68" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">Small passenger</text>
      <text x="80" y="94" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">volumes</text>
    </g>

    <path d="M 170 125 L 185 125" stroke="#141414" stroke-width="3"/>

    <!-- Step 2: High Per-Head Fees -->
    <g transform="translate(195, 60)">
      <rect x="0" y="0" width="160" height="130" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="36" rx="6" fill="#d7263d"/>
      <text x="80" y="24" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">2. Higher Fees</text>
      <text x="80" y="68" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">Fixed runway debt</text>
      <text x="80" y="94" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">split by few</text>
    </g>

    <path d="M 365 125 L 380 125" stroke="#141414" stroke-width="3"/>

    <!-- Step 3: Expensive Fares -->
    <g transform="translate(390, 60)">
      <rect x="0" y="0" width="160" height="130" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="36" rx="6" fill="#d7263d"/>
      <text x="80" y="24" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">3. High Fares</text>
      <text x="80" y="68" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">Taxes exceed base</text>
      <text x="80" y="94" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">fare on ticket</text>
    </g>

    <path d="M 560 125 L 575 125" stroke="#141414" stroke-width="3"/>

    <!-- Step 4: Suppressed Demand -->
    <g transform="translate(585, 60)">
      <rect x="0" y="0" width="135" height="130" rx="6" fill="#ffffff" stroke="#141414" stroke-width="2"/>
      <rect x="0" y="0" width="135" height="36" rx="6" fill="#f2c12e"/>
      <text x="67" y="24" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#141414" text-anchor="middle">4. Lost Travel</text>
      <text x="67" y="68" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">Travelers stay</text>
      <text x="67" y="94" font-family="Arial, sans-serif" font-size="18" fill="#141414" text-anchor="middle">home or drive</text>
    </g>

    <!-- Return Loop Arrow at bottom -->
    <path d="M 650 200 L 650 220 L 70 220 L 70 200" fill="none" stroke="#d7263d" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="360" y="242" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d7263d" text-anchor="middle">Vicious cycle: Suppressed demand keeps traffic low</text>
  </g>
</svg>
