<text x="32" y="566" class="row-hdr">Takeaway:</text>
<text x="122" y="566" class="fig-sub">Gemini is the only model with native end-to-end video reasoning.</text>
<text x="32" y="590" class="fig-sub">Grok bridges media via ffmpeg; Claude and ChatGPT require text transcripts.</text>
