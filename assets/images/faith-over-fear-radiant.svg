<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .faith-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        fill: #0a0a0a;
        text-anchor: middle;
      }
      .faith-watermark {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        fill: #0a0a0a;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Crisp White Matte Background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Minimalist Corner Registration / Crop Marks -->
  <g stroke="#0a0a0a" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 40 64 L 40 40 L 64 40" />
    <path d="M 1216 40 L 1240 40 L 1240 64" />
    <path d="M 40 656 L 40 680 L 64 680" />
    <path d="M 1216 680 L 1240 680 L 1240 656" />
  </g>

  <!-- Subtle Inset Hairline Frame -->
  <rect x="52" y="52" width="1176" height="616" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>

  <!-- Editorial Geometric Sunburst / Rising Dawn Emblem -->
  <g id="dawn-emblem" transform="translate(640, 148)">
    <!-- Baseline of the emblem -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#0a0a0a" stroke-width="2.5"/>
    <!-- Rising Sun Semicircle -->
    <path d="M -34 0 A 34 34 0 0 1 34 0 Z" fill="#0a0a0a"/>
    <!-- Concentric inner arc -->
    <path d="M -22 0 A 22 22 0 0 1 22 0 Z" fill="#ffffff"/>
    <path d="M -12 0 A 12 12 0 0 1 12 0 Z" fill="#0a0a0a"/>

    <!-- Radiating Dawn Rays (Pointing upward, strictly clear of text) -->
    <!-- 90 deg vertical -->
    <line x1="0" y1="-44" x2="0" y2="-72" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
    <!-- 70 deg & 110 deg -->
    <line x1="16" y1="-41" x2="26" y2="-68" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-16" y1="-41" x2="-26" y2="-68" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 50 deg & 130 deg -->
    <line x1="29" y1="-33" x2="49" y2="-55" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-29" y1="-33" x2="-49" y2="-55" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 30 deg & 150 deg -->
    <line x1="39" y1="-21" x2="65" y2="-36" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-39" y1="-21" x2="-65" y2="-36" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 12 deg & 168 deg -->
    <line x1="43" y1="-9" x2="74" y2="-15" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-43" y1="-9" x2="-74" y2="-15" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Flanking minimal geometry -->
    <circle cx="-135" cy="0" r="3" fill="#0a0a0a"/>
    <circle cx="135" cy="0" r="3" fill="#0a0a0a"/>
  </g>

  <!-- FAITH (On Top) -->
  <text x="640" y="314" class="faith-title" font-size="124" letter-spacing="18">FAITH</text>

  <!-- The Line (Replacing 'OVER') -->
  <g id="divider-rule">
    <!-- Solid, Confident Horizontal Bar -->
    <line x1="260" y1="360" x2="1020" y2="360" stroke="#0a0a0a" stroke-width="6" stroke-linecap="square"/>
    <!-- Terminal Geometric Accent Marks -->
    <rect x="254" y="352" width="6" height="16" fill="#0a0a0a"/>
    <rect x="1020" y="352" width="6" height="16" fill="#0a0a0a"/>
  </g>

  <!-- FEAR (Below the line) -->
  <text x="640" y="496" class="faith-title" font-size="124" letter-spacing="30">FEAR</text>

  <!-- Watermark: rdjarbeng.com (Subtle & Visible per guidelines) -->
  <g transform="translate(640, 650)">
    <line x1="-240" y1="-6" x2="-120" y2="-6" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" class="faith-watermark" font-size="18" letter-spacing="6" opacity="0.6">rdjarbeng.com</text>
    <line x1="120" y1="-6" x2="240" y2="-6" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
  </g>
</svg>
