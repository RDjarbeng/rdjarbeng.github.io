name: Sync YouTube Playlists

on:
  schedule:
    # Run at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    paths:
      - '_video_collections/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Sync Playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ruby .github/scripts/sync_youtube_playlists.rb

      - name: Commit and push changes
        id: commit-step
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _gallery/videos/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new videos to sync."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-sync YouTube playlists"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Deploy
        if: steps.commit-step.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run jekyll.yml --ref main
