name: Deploy Eleventy site to Pages with Decap CMS

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'TODO*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ID: ${{ secrets.DECAP_SITE_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.DECAP_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.DECAP_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Eleventy
        run: npm run build
        env:
          ELEVENTY_ENV: production
      - name: Check internal links
        # Fails the deploy if any page links to a URL the build did not produce.
        run: npm run check:links
      - name: Push index to Algolia
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -E "^(_posts/|_personal/|_gallery/|_authors/|_video_collections/|about\.md)"; then
            echo "Content changes detected. Running Algolia index sync..."
            npm run sync:algolia || echo "Algolia indexing skipped (quota or credit limit reached)"
          else
            echo "No content files changed. Skipping Algolia indexing."
          fi
        continue-on-error: true
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Optimize cover images and thumbnails
        # Pillow instead of ImageMagick: installing ImageMagick with apt took
        # 7 to 10 minutes per deploy; this whole step takes seconds.
        run: |
          python -m pip install --quiet pillow
          python scripts/optimize_covers.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
