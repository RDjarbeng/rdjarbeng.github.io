name: Deploy Eleventy site to Pages with Decap CMS

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'TODO*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ID: ${{ secrets.DECAP_SITE_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.DECAP_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.DECAP_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 24 is the current LTS; "24" always resolves to its latest patch release
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Eleventy
        run: npm run build
        env:
          ELEVENTY_ENV: production
      - name: Check internal links
        # Fails the deploy if any page links to a URL the build did not produce.
        run: npm run check:links
      - name: Push index to Algolia
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -E "^(_posts/|_personal/|_gallery/|_authors/|_video_collections/|about\.md)"; then
            echo "Content changes detected. Running Algolia index sync..."
            npm run sync:algolia || echo "Algolia indexing skipped (quota or credit limit reached)"
          else
            echo "No content files changed. Skipping Algolia indexing."
          fi
        continue-on-error: true
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Optimize cover images and thumbnails
        # Pillow instead of ImageMagick: installing ImageMagick with apt took
        # 7 to 10 minutes per deploy; this whole step takes seconds.
        run: |
          python -m pip install --quiet pillow
          python scripts/optimize_covers.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Opens (or comments on) a GitHub issue that @-mentions the owner when a
  # deploy takes longer than 5 minutes, so slow builds get noticed by email.
  build-time-alert:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check how long this deploy took
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIMIT_SECONDS: "300"
          OWNER: ${{ github.repository_owner }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          took="$((elapsed / 60))m $((elapsed % 60))s"
          echo "Deploy took $took" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -le "$LIMIT_SECONDS" ]; then
            exit 0
          fi
          echo "::warning::Deploy took $took, over the 5 minute limit"
          slow=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '
            .jobs[] | .name as $job | .steps[]
            | select(.started_at != null and .completed_at != null)
            | {job: $job, step: .name, s: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))}
            | select(.s >= 30) | "- \(.job) / \(.step): \(.s)s"')
          body=$(printf '@%s the deploy for %s took **%s** (limit 5 minutes).\n\nSteps over 30 seconds:\n%s\n\nRun: %s' \
            "$OWNER" "${GITHUB_SHA:0:7}" "$took" "${slow:-none recorded}" "$RUN_URL")
          gh label create slow-deploy --repo "$REPO" --color D93F0B --description "Deploy took over 5 minutes" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label slow-deploy --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label slow-deploy --title "Slow deploy: $took" --body "$body"
          fi
