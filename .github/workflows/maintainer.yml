name: Site maintainer (Claude)

# Fixes bugs filed from the Telegram bot (or by hand) and answers @claude mentions.
#   - An issue gets the `bug` label  -> Claude works on it on a new branch and opens a PR.
#   - A comment containing @claude on an issue or PR -> Claude follows that instruction
#     (e.g. "@claude the image is still cropped on mobile").
# It never pushes to main; every change arrives as a PR for Richard to merge.
# Rules for the agent live in CLAUDE.md ("Maintainer agent (GitHub Actions)").
#
# Needs the repo secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
# Spend is capped by --max-turns below and by the workspace spend limit on platform.claude.com.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One run per issue/PR at a time; a second @claude waits instead of racing the first.
  group: maintainer-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'bug') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: bug
          trigger_phrase: "@claude"
          track_progress: true
          branch_prefix: "fix/"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Bash(npm run build),Bash(npm run build:*),Bash(npm run check:links),Bash(npx @11ty/eleventy:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(ls:*),Bash(grep:*),Bash(find:*)"
