<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Full-size background -->
  <rect width="1280" height="720" fill="#cfd5da"/>

  <!-- Headline: Exactly one headline, font size >= 96px, Arial Black, solid color, split with tspans -->
  <text x="56" y="112" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="96" fill="#141414" letter-spacing="-1">
    <tspan x="56" y="112">I CAN'T SEE</tspan>
    <tspan x="56" y="210">YOU IN FOG</tspan>
  </text>

  <!-- Street at the bottom of the image -->
  <g id="street">
    <!-- Road surface -->
    <rect x="0" y="560" width="1280" height="160" fill="#141414"/>
    <!-- Curb line -->
    <rect x="0" y="556" width="1280" height="4" fill="#ffffff" fill-opacity="0.8"/>
    <!-- Lane divider markings -->
    <line x1="0" y1="638" x2="1280" y2="638" stroke="#f2c12e" stroke-width="7" stroke-dasharray="55 35"/>
  </g>

  <!-- Red car seen side on at the left, facing right with its headlight on -->
  <g id="car">
    <!-- Headlight beam projecting forward and down onto the road -->
    <polygon points="524,462 890,432 930,560 524,476" fill="#f2c12e" fill-opacity="0.32"/>
    <polygon points="524,464 730,446 750,535 524,474" fill="#ffffff" fill-opacity="0.45"/>

    <!-- Car main body (facing right) -->
    <path d="M 65 520
             L 55 480
             Q 56 440 68 434
             L 142 430
             L 220 355
             Q 285 352 355 355
             L 435 430
             L 512 452
             Q 528 468 524 485
             L 515 520
             L 490 520
             A 50 50 0 0 0 390 520
             L 210 520
             A 50 50 0 0 0 110 520
             Z"
          fill="#d7263d"/>

    <!-- Car windows (tinted blue) -->
    <!-- Rear window -->
    <polygon points="152,426 223,361 286,361 286,426" fill="#1d4f9c"/>
    <!-- Front window -->
    <polygon points="298,361 350,361 424,426 298,426" fill="#1d4f9c"/>

    <!-- Side mirror -->
    <polygon points="418,424 438,422 438,432 418,430" fill="#d7263d"/>
    <line x1="416" y1="428" x2="422" y2="428" stroke="#141414" stroke-width="2.5"/>

    <!-- Door seams and door handles -->
    <line x1="292" y1="426" x2="292" y2="518" stroke="#141414" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="416" y1="432" x2="400" y2="518" stroke="#141414" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="215" y="440" width="24" height="6" rx="3" fill="#141414"/>
    <rect x="325" y="440" width="24" height="6" rx="3" fill="#141414"/>

    <!-- Taillight -->
    <polygon points="56,442 66,438 68,454 56,456" fill="#ffffff"/>

    <!-- Front headlight housing and lamp -->
    <polygon points="502,456 525,463 522,476 502,472" fill="#ffffff"/>
    <polygon points="506,458 523,464 521,474 506,470" fill="#f2c12e"/>

    <!-- Rear wheel (center: 160, 520) -->
    <g id="rear-wheel">
      <circle cx="160" cy="520" r="40" fill="#141414"/>
      <circle cx="160" cy="520" r="37" fill="none" stroke="#252525" stroke-width="3"/>
      <circle cx="160" cy="520" r="26" fill="#ffffff"/>
      <circle cx="160" cy="520" r="18" fill="#cfd5da"/>
      <line x1="160" y1="496" x2="160" y2="544" stroke="#ffffff" stroke-width="5"/>
      <line x1="138" y1="504" x2="182" y2="536" stroke="#ffffff" stroke-width="5"/>
      <line x1="138" y1="536" x2="182" y2="504" stroke="#ffffff" stroke-width="5"/>
      <circle cx="160" cy="520" r="9" fill="#d7263d"/>
      <circle cx="160" cy="520" r="4" fill="#ffffff"/>
    </g>

    <!-- Front wheel (center: 440, 520) -->
    <g id="front-wheel">
      <circle cx="440" cy="520" r="40" fill="#141414"/>
      <circle cx="440" cy="520" r="37" fill="none" stroke="#252525" stroke-width="3"/>
      <circle cx="440" cy="520" r="26" fill="#ffffff"/>
      <circle cx="440" cy="520" r="18" fill="#cfd5da"/>
      <line x1="440" y1="496" x2="440" y2="544" stroke="#ffffff" stroke-width="5"/>
      <line x1="418" y1="504" x2="462" y2="536" stroke="#ffffff" stroke-width="5"/>
      <line x1="418" y1="536" x2="462" y2="504" stroke="#ffffff" stroke-width="5"/>
      <circle cx="440" cy="520" r="9" fill="#d7263d"/>
      <circle cx="440" cy="520" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Person standing at the right holding up a phone -->
  <g id="person">
    <!-- Shoes resting on the ground -->
    <path d="M 1045 548 L 1070 548 L 1072 560 L 1038 560 Q 1036 552 1045 548 Z" fill="#141414"/>
    <line x1="1037" y1="559" x2="1072" y2="559" stroke="#ffffff" stroke-width="2"/>
    <path d="M 1085 548 L 1108 548 L 1110 560 L 1078 560 Q 1076 552 1085 548 Z" fill="#141414"/>
    <line x1="1077" y1="559" x2="1110" y2="559" stroke="#ffffff" stroke-width="2"/>

    <!-- Trousers / Legs -->
    <polygon points="1046,450 1072,450 1068,548 1046,548" fill="#141414"/>
    <polygon points="1072,450 1098,450 1106,548 1084,548" fill="#141414"/>

    <!-- Back arm hanging naturally -->
    <path d="M 1096 368 Q 1112 405 1106 440" stroke="#1d4f9c" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Jacket / Torso -->
    <path d="M 1050 365 Q 1075 358 1102 365 L 1105 455 L 1046 455 Z" fill="#1d4f9c"/>
    <line x1="1075" y1="365" x2="1075" y2="455" stroke="#ffffff" stroke-width="2"/>
    <polygon points="1066,360 1084,360 1075,372" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="1070" y="344" width="12" height="18" fill="#f2c12e"/>

    <!-- Head and profile facing left -->
    <circle cx="1076" cy="330" r="18" fill="#f2c12e"/>
    <path d="M 1060 326 L 1054 332 L 1062 336 Z" fill="#f2c12e"/>
    <!-- Hair / Cap -->
    <path d="M 1058 326 C 1058 310, 1094 310, 1095 328 C 1095 336, 1088 344, 1084 344 C 1080 344, 1078 335, 1070 335 C 1064 335, 1060 330, 1058 326 Z" fill="#141414"/>

    <!-- Raised front arm holding up phone -->
    <path d="M 1054 368 L 1018 396 L 982 362" stroke="#1d4f9c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Hand gripping phone -->
    <circle cx="977" cy="358" r="9" fill="#f2c12e"/>

    <!-- Smartphone -->
    <rect x="956" y="325" width="18" height="32" rx="4" fill="#141414"/>
    <rect x="958" y="327" width="14" height="28" rx="2" fill="#ffffff"/>
    <rect x="961" y="333" width="8" height="8" rx="1" fill="#d7263d"/>
    <!-- Fingers wrapped around phone -->
    <rect x="968" y="342" width="6" height="12" rx="3" fill="#f2c12e"/>
  </g>

  <!-- Curved radio wave arcs travelling from the phone toward the car -->
  <g id="radio-waves">
    <!-- Pulse dot at phone source -->
    <circle cx="965" cy="342" r="7" fill="#1d4f9c"/>

    <!-- Expanding concentric arcs directed leftward toward the car -->
    <!-- Arc 1 -->
    <path d="M 926 304 A 55 55 0 0 0 926 380" stroke="#1d4f9c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Arc 2 -->
    <path d="M 873 268 A 120 120 0 0 0 873 420" stroke="#1d4f9c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Arc 3 -->
    <path d="M 792 248 A 200 200 0 0 0 792 442" stroke="#1d4f9c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Arc 4 -->
    <path d="M 681 248 A 300 300 0 0 0 681 442" stroke="#1d4f9c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Arc 5 (reaching car hood and windshield) -->
    <path d="M 556 250 A 420 420 0 0 0 556 440" stroke="#1d4f9c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Arc 6 (wrapping front of vehicle) -->
    <path d="M 453 255 A 520 520 0 0 0 453 435" stroke="#1d4f9c" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wide horizontal pale fog bands drawn across both car and person -->
  <g id="fog-bands">
    <!-- Band 1: Upper fog band (strictly below headline y=210) -->
    <path d="M -20 275
             C 180 260, 360 285, 560 270
             C 760 255, 960 280, 1140 265
             C 1220 260, 1260 270, 1300 265
             L 1300 330
             C 1180 345, 980 325, 780 340
             C 580 355, 380 330, 180 345
             C 80 350, 20 338, -20 340
             Z"
          fill="#ffffff" fill-opacity="0.55"/>

    <!-- Band 2: Mid-upper fog band across windows, waves, and phone -->
    <path d="M -20 365
             C 160 380, 340 355, 540 370
             C 740 385, 940 360, 1120 375
             C 1210 380, 1260 370, 1300 372
             L 1300 435
             C 1160 420, 960 445, 760 428
             C 560 412, 360 438, 160 422
             C 70 415, 20 428, -20 425
             Z"
          fill="#ffffff" fill-opacity="0.52"/>

    <!-- Band 3: Mid-lower fog band across car hood, beam, and torso -->
    <path d="M -20 460
             C 150 445, 320 470, 520 455
             C 720 440, 910 465, 1100 450
             C 1200 445, 1260 455, 1300 452
             L 1300 525
             C 1180 538, 980 515, 780 530
             C 580 545, 380 522, 180 535
             C 80 540, 20 530, -20 532
             Z"
          fill="#ffffff" fill-opacity="0.55"/>

    <!-- Band 4: Ground-level fog band across wheels and lower legs -->
    <path d="M -20 550
             C 170 565, 350 540, 550 555
             C 750 570, 950 545, 1130 560
             C 1220 568, 1260 558, 1300 560
             L 1300 620
             C 1170 605, 970 625, 770 610
             C 570 595, 370 618, 170 602
             C 70 595, 20 608, -20 605
             Z"
          fill="#ffffff" fill-opacity="0.58"/>
  </g>

  <!-- Watermark: exactly one watermark, rdjarbeng.com, Arial bold 26px, text-anchor end, at x=1236 y=694 -->
  <text x="1236" y="694" font-family="Arial, sans-serif" font-weight="bold" font-size="26" text-anchor="end" fill="#ffffff">rdjarbeng.com</text>
</svg>
