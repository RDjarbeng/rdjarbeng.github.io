<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f4f1e6"/>

  <!-- Headline -->
  <text x="56" y="118" font-family="'Arial Black',Arial,sans-serif" font-size="96" font-weight="900" fill="#141414">
    <tspan x="56" dy="0">BUILT ON THE</tspan>
    <tspan x="56" dy="104">YOUTUBE API</tspan>
  </text>

  <!-- Connecting Lines -->
  <!-- Line to Window 1 (Top-Left) -->
  <line x1="530" y1="425" x2="350" y2="360" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
  <!-- Line to Window 2 (Bottom-Left) -->
  <line x1="530" y1="505" x2="350" y2="570" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
  <!-- Line to Window 3 (Top-Right) -->
  <line x1="750" y1="425" x2="930" y2="360" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
  <!-- Line to Window 4 (Bottom-Right) -->
  <line x1="750" y1="505" x2="930" y2="570" stroke="#141414" stroke-width="12" stroke-linecap="round"/>

  <!-- App Window 1: Top-Left (x=140, y=265, w=220, h=150) -->
  <g id="app-window-1">
    <rect x="140" y="265" width="220" height="150" rx="12" fill="#ffffff"/>
    <path d="M 140,303 L 140,277 Q 140,265 152,265 L 348,265 Q 360,265 360,277 L 360,303 Z" fill="#1d4f9c"/>
    <line x1="140" y1="303" x2="360" y2="303" stroke="#141414" stroke-width="6"/>
    <circle cx="160" cy="284" r="5" fill="#ffffff"/>
    <circle cx="176" cy="284" r="5" fill="#ffffff"/>
    <circle cx="192" cy="284" r="5" fill="#ffffff"/>
    <rect x="158" y="319" width="184" height="78" rx="8" fill="#f2c12e" stroke="#141414" stroke-width="6"/>
    <rect x="140" y="265" width="220" height="150" rx="12" fill="none" stroke="#141414" stroke-width="8"/>
  </g>

  <!-- App Window 2: Bottom-Left (x=140, y=510, w=220, h=150) -->
  <g id="app-window-2">
