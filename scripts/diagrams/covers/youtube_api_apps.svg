    <rect x="520" y="385" width="240" height="160" rx="40" fill="#d7263d" stroke="#141414" stroke-width="8"/>
    <polygon points="616,427 680,465 616,503" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Watermark -->
  <text x="1236" y="694" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="26" fill="#141414">rdjarbeng.com</text>
