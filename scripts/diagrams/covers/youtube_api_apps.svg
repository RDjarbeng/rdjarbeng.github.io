  </g>

  <!-- App Window 3: Top-Right (x=920, y=265, w=220, h=150) -->
  <g id="app-window-3">
    <rect x="920" y="265" width="220" height="150" rx="12" fill="#ffffff"/>
    <path d="M 920,303 L 920,277 Q 920,265 932,265 L 1128,265 Q 1140,265 1140,277 L 1140,303 Z" fill="#1d4f9c"/>
    <line x1="920" y1="303" x2="1140" y2="303" stroke="#141414" stroke-width="6"/>
