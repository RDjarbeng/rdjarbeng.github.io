    <path d="M 920,548 L 920,522 Q 920,510 932,510 L 1128,510 Q 1140,510 1140,522 L 1140,548 Z" fill="#1d4f9c"/>
    <line x1="920" y1="548" x2="1140" y2="548" stroke="#141414" stroke-width="6"/>
