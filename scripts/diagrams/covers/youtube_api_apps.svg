    <path d="M 140,548 L 140,522 Q 140,510 152,510 L 348,510 Q 360,510 360,522 L 360,548 Z" fill="#1d4f9c"/>
    <line x1="140" y1="548" x2="360" y2="548" stroke="#141414" stroke-width="6"/>
    <circle cx="160" cy="529" r="5" fill="#ffffff"/>
    <circle cx="176" cy="529" r="5" fill="#ffffff"/>
    <circle cx="192" cy="529" r="5" fill="#ffffff"/>
