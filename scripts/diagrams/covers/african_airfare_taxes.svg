<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Cover for African Airfare Taxes Post
       Strict thumbnail rules:
       - At most three text elements: Headline (>=64px), short hook, rdjarbeng.com watermark
       - Exactly ONE solid text color (#141414)
       - No panels, cards, dashboards, code, tables, charts with values or small labels
       - Clean, aeronautically accurate side-profile commercial airliner climbing:
         * Authentic Boeing/Airbus side elevation geometry
         * Low-wing swept back with dihedral winglet
         * Underslung turbofan engine mounted under wing leading edge
         * Tail fin rising on top of rear fuselage
       Render: node scripts/diagrams/svg_to_jpg.js scripts/diagrams/covers/african_airfare_taxes.svg assets/images/posts/covers/african_airfare_taxes_cover.jpg -->
  <rect width="1280" height="720" fill="#f4f1e6"/>

  <!-- Text Element 1 (Headline, >= 64px) & Text Element 2 (Short hook) -->
  <!-- Exactly ONE solid text color: #141414 -->
  <g fill="#141414" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" text-anchor="middle">
    <text x="640" y="112" font-size="72" font-weight="900" letter-spacing="1">AIRFARES IN AFRICA</text>
    <text x="640" y="162" font-size="24" font-weight="700" letter-spacing="4" font-family="Arial, Helvetica, sans-serif">WHY TAXES OUTWEIGH THE FARE</text>
  </g>

  <!-- Illustration: Boarding Pass Graphic + Sleek Climbing Airliner Profile -->
  <g transform="translate(640, 430)">
    <!-- Runway / Flight path base line -->
    <rect x="-480" y="150" width="960" height="8" fill="#141414" rx="4"/>
    <line x1="-420" y1="190" x2="420" y2="190" stroke="#f2c12e" stroke-width="6" stroke-dasharray="32 20"/>

    <!-- Stylized boarding pass silhouette (matte blue and red) -->
    <g transform="translate(-400, -90)">
      <!-- Left ticket stub: Blue -->
      <path d="M 0 0 L 140 0 L 140 220 L 0 220 Z" fill="#1d4f9c"/>
      <!-- Perforation notches -->
      <circle cx="140" cy="40" r="12" fill="#f4f1e6"/>
      <circle cx="140" cy="110" r="12" fill="#f4f1e6"/>
      <circle cx="140" cy="180" r="12" fill="#f4f1e6"/>
      <!-- Right ticket body: Red -->
      <path d="M 140 0 L 480 0 L 480 220 L 140 220 Z" fill="#d7263d"/>
      <!-- Ticket barcode graphic (pure geometric shapes, no text) -->
      <g fill="#ffffff" opacity="0.85">
        <rect x="170" y="140" width="8" height="60"/>
        <rect x="190" y="140" width="16" height="60"/>
        <rect x="216" y="140" width="6" height="60"/>
        <rect x="232" y="140" width="22" height="60"/>
        <rect x="264" y="140" width="10" height="60"/>
        <rect x="284" y="140" width="18" height="60"/>
        <rect x="312" y="140" width="8" height="60"/>
        <rect x="330" y="140" width="26" height="60"/>
        <rect x="366" y="140" width="14" height="60"/>
        <rect x="390" y="140" width="10" height="60"/>
        <rect x="410" y="140" width="24" height="60"/>
        <rect x="444" y="140" width="14" height="60"/>
      </g>
      <!-- Circular official stamp icon on ticket -->
      <circle cx="230" cy="70" r="38" fill="none" stroke="#f2c12e" stroke-width="7"/>
      <circle cx="230" cy="70" r="28" fill="none" stroke="#f2c12e" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Ticket header stripe -->
      <rect x="0" y="0" width="480" height="18" fill="#141414"/>
    </g>

    <!-- Sleek Commercial Jetliner Climbing (Authentic Airliner Profile) -->
    <!-- Nose points to top-right (+X), climbing smoothly at -18 degrees -->
    <g transform="translate(130, -50) rotate(-18)">

      <!-- 1. Tail Fin / Vertical Stabilizer (rises naturally from upper rear fuselage) -->
      <path d="M -110 -18 L -170 -95 L -194 -92 L -185 -4 Z" fill="#f2c12e" stroke="#141414" stroke-width="3.5"/>
      <!-- Tail Fin Livery Accent (Navy Blue Stripe) -->
      <path d="M -138 -55 L -170 -95 L -194 -92 L -180 -55 Z" fill="#1d4f9c"/>

      <!-- 2. Horizontal Stabilizer at tail cone -->
      <path d="M -145 2 L -190 10 L -200 7 L -175 -2 Z" fill="#1d4f9c" stroke="#141414" stroke-width="2.5"/>

      <!-- 3. Fuselage (White Upper Cabin, Dark Navy Blue Belly) -->
      <path d="M 235 2 C 215 -16, 160 -18, -110 -18 C -150 -18, -185 -10, -205 -2 C -208 2, -207 7, -198 10 C -150 18, 100 20, 205 11 C 225 8, 235 5, 235 2 Z" fill="#ffffff" stroke="#141414" stroke-width="3.5"/>

      <!-- Navy Blue Lower Belly Stripe -->
      <path d="M -180 8 C -120 17, 90 18, 205 11 C 220 8, 232 5, 235 2 C 215 13, 110 14, -100 13 C -140 13, -165 10, -180 8 Z" fill="#1d4f9c"/>

      <!-- Cockpit Windshield (on TOP of the nose) -->
      <path d="M 188 -13 L 214 -6 L 212 0 L 186 -6 Z" fill="#141414"/>

      <!-- Passenger Cabin Windows (neat row along upper fuselage) -->
      <g fill="#141414">
        <rect x="155" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="141" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="127" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="113" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="99" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="85" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="71" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="57" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="43" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="29" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="15" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="1" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="-13" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="-27" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="-41" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="-55" y="-6" width="6" height="9" rx="2.5"/>
        <rect x="-69" y="-6" width="6" height="9" rx="2.5"/>
      </g>

      <!-- 4. Turbofan Jet Engine (Mounted under the wing leading edge) -->
      <!-- Pylon -->
      <path d="M 40 12 L 48 12 L 42 22 L 32 22 Z" fill="#141414"/>
      <!-- Engine Nacelle (Matte Red) -->
      <rect x="12" y="20" width="60" height="22" rx="11" fill="#d7263d" stroke="#141414" stroke-width="3"/>
      <!-- Front Air Intake (Faces right/forward) -->
      <ellipse cx="70" cy="31" rx="4" ry="9" fill="#141414"/>
      <!-- Exhaust Nozzle (Faces left/rear) -->
      <path d="M 12 26 L 4 28 L 4 34 L 12 36 Z" fill="#57514a"/>

      <!-- 5. Main Wing (Side Elevation Profile: Low-wing attached to belly, swept back gracefully) -->
      <!-- Root: (65, 12) -> Sweeps back to (-42, 2) -> Winglet curves up to (-52, -22) -> Trailing: (12, 18) -->
      <path d="M 65 12 L -42 2 L -52 -22 L -60 -19 L -50 6 L 12 18 Z" fill="#f2c12e" stroke="#141414" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Text Element 3: Watermark (rdjarbeng.com, bottom center, solid black) -->
  <text x="640" y="690" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#141414" text-anchor="middle">rdjarbeng.com</text>
</svg>
