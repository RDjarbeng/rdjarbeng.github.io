<script src="{{ '/assets/js/simple-jekyll-search.min.js' | relative_url }}"></script>

<style>
#results-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
@media (max-width: 600px) {
  #results-container {
    grid-template-columns: 1fr;
  }
}

.search-results-none {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px;
  color: var(--text-color-light, #666);
  font-size: 1.1rem;
}

/* Nav search dropdown styling */
.nav-search-results-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--card-bg, #fff);
  border: 1px solid var(--card-border, #eaeaea);
  border-radius: 0 0 12px 12px;
  max-height: 400px;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: 0 8px 24px var(--shadow-color, rgba(0,0,0,0.12));
}

.nav-search-item {
  border-bottom: 1px solid var(--card-border, #eaeaea);
}
.nav-search-item:last-child {
  border-bottom: none;
}
.nav-search-link {
  display: block;
  padding: 12px 16px;
  color: var(--text-color, #333);
  text-decoration: none;
  font-size: 0.95rem;
  transition: background 0.15s ease;
}
.nav-search-link:hover {
  background: var(--border-color, #f5f5f5);
  text-decoration: none;
}
.nav-search-title {
  display: block;
  font-weight: 600;
  margin-bottom: 4px;
}
.nav-search-date {
  font-size: 0.8rem;
  color: var(--text-color-light, #777);
}
</style>

<script>
(function() {
  var sjs = null;
  var navSjs = null;
  var mainInput = document.getElementById('search-input');
  var resultsContainer = document.getElementById('results-container');
  var browseSections = document.getElementById('search-browse-sections');
  var emptyHint = document.getElementById('search-empty-hint');

  if (mainInput && resultsContainer) {
    sjs = SimpleJekyllSearch({
      searchInput: mainInput,
      resultsContainer: resultsContainer,
      json: '{{ "/search.json" | relative_url }}',
      searchResultTemplate: '<div class="post-card"><a class="post-link" href="{url}" style="text-decoration: none; color: inherit;">{image_html}<div class="post-card-content" style="padding: 16px;"><span class="post-card-category" style="display:inline-block; margin-bottom: 6px; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: var(--border-color, #eee);">{display_type}</span><h3 title="{title}" style="font-size: 1.1rem; margin: 0 0 8px; font-weight: 700; line-height: 1.3;">{title}</h3><p style="font-size: 0.9rem; color: var(--text-color-light, #666); line-height: 1.4; margin-bottom: 10px; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;">{excerpt}</p><div class="post-meta-categories-container" style="font-size: 0.8rem; color: #888;"><span>{date}</span> · <span>{read_time}</span></div></div></a></div>',
      noResultsText: '<div class="search-results-none"><p>No results found for your query.</p></div>',
      limit: 20
    });

    function toggleBrowse() {
      var q = mainInput.value.trim();
      if (q.length > 0) {
        if (browseSections) browseSections.style.display = 'none';
        if (emptyHint) emptyHint.style.display = 'none';
      } else {
        if (browseSections) browseSections.style.display = 'block';
        if (emptyHint) emptyHint.style.display = 'block';
        resultsContainer.innerHTML = '';
      }
    }

    mainInput.addEventListener('input', toggleBrowse);
    mainInput.addEventListener('keyup', toggleBrowse);
  }

  var navSearchInput = document.getElementById('nav-search-input');
  var navSearchResults = document.getElementById('nav-search-results');

  if (navSearchInput && navSearchResults) {
    navSearchResults.classList.add('nav-search-results-dropdown');

    navSjs = SimpleJekyllSearch({
      searchInput: navSearchInput,
      resultsContainer: navSearchResults,
      json: '{{ "/search.json" | relative_url }}',
      searchResultTemplate: '<div class="nav-search-item"><a class="nav-search-link" href="{url}"><div class="nav-search-content"><span class="nav-search-title">{title}</span><span class="nav-search-date">{display_type} • {date}</span></div></a></div>',
      noResultsText: '<div class="nav-search-item" style="padding: 12px 16px; color: #888;">No results found</div>',
      limit: 6
    });

    document.addEventListener('click', function (e) {
      if (e.target !== navSearchInput && !navSearchResults.contains(e.target)) {
        navSearchResults.style.display = 'none';
      }
    });

    navSearchInput.addEventListener('focus', function () {
      if (navSearchInput.value.length > 0) {
        navSearchResults.style.display = 'block';
      }
    });

    navSearchInput.addEventListener('input', function () {
      if (navSearchInput.value.length > 0) {
        navSearchResults.style.display = 'block';
      } else {
        navSearchResults.style.display = 'none';
      }
    });
  }

  // Handle URL query parameter `?q=...` (Google Sitelinks Searchbox)
  window.addEventListener('DOMContentLoaded', function () {
    var urlParams = new URLSearchParams(window.location.search);
    var query = urlParams.get('q');
    if (query && mainInput) {
      mainInput.value = query;
      setTimeout(function () {
        mainInput.dispatchEvent(new Event('input', { bubbles: true }));
        mainInput.dispatchEvent(new Event('keyup', { bubbles: true }));
      }, 300);
    }
  });
})();
</script>
