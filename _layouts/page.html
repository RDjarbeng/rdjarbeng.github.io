---
layout: default
---
{% assign page_title = title | default: page.title %}
{% assign page_custom_css = custom_css_class | default: page.custom_css_class %}

<article class="post {% if page_custom_css %}{{ page_custom_css }}{% endif %}">

  <header class="post-header">
    <h1 class="post-title">{{ page_title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
